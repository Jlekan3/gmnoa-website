<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>GMNOA Partners</title>
    <meta
        name="description"
        content="Meet the partners and collaborators supporting the Ghana Merchant Navy Officers' Association."
    >
    <link rel="canonical" href="https://gmnoa.org/partners.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="GMNOA Partners">
    <meta property="og:description" content="Meet the partners and collaborators supporting the Ghana Merchant Navy Officers' Association.">
    <meta property="og:url" content="https://gmnoa.org/partners.html">
    <meta property="og:image" content="https://gmnoa.org/assets/images/Asset%202.svg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet"
    >
    <style>
        :root {
            --blue: #0096ff;
            --navy: #061b2d;
            --text: #18364d;
            --muted: #718697;
            --border: #dcecf7;
            --light: #f7fbff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;
            color: var(--text);
            background: var(--light);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255,255,255,.94);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(16px);
        }

        .container {
            width: min(1120px, calc(100% - 40px));
            margin: 0 auto;
        }

        .nav {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: "Manrope", sans-serif;
            color: var(--navy);
            font-weight: 800;
        }

        .brand img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            display: block;
        }

        .back {
            color: var(--blue);
            font-size: 14px;
            font-weight: 700;
        }

        main {
            padding: 58px 0 80px;
        }

        .page-header {
            max-width: 860px;
            margin: 0 auto 34px;
        }

        .meta {
            color: var(--blue);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 820px;
            margin-top: 14px;
            color: var(--navy);
            font-family: "Manrope", sans-serif;
            font-size: clamp(34px, 6vw, 58px);
            line-height: 1.04;
        }

        .intro {
            margin-top: 18px;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.75;
        }

        .partners-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 16px;
        }
        :root {
            --white: #fff;
            --blue-dark: #007bd1;
            --radius-sm: 10px;
            --shadow-sm: 0 8px 30px rgba(0, 80, 140, .07);
        }
        .partner-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            aspect-ratio: 1 / 1;
            padding: 0;
            overflow: hidden;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            text-decoration: none;
            transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
        }
        a.partner-card:hover,
        a.partner-card:focus-visible {
            border-color: var(--blue-dark);
            box-shadow: var(--shadow-sm);
            transform: translateY(-3px);
        }
        .partner-card:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 4px;
        }
        .partner-card img {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .partner-name-fallback {
            padding: 16px;
            color: var(--blue-dark);
            font-family: "Manrope", sans-serif;
            font-size: 18px;
            font-weight: 800;
            line-height: 1.3;
            text-align: center;
            overflow-wrap: anywhere;
        }
        .partner-card[hidden] { display: none; }
        .partners-message {
            grid-column: 1 / -1;
            margin: 0;
            padding: 48px 24px;
            color: var(--text);
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            text-align: center;
        }

        @media (prefers-reduced-motion: reduce) {
            .partner-card { transition: none; }
            a.partner-card:hover, a.partner-card:focus-visible { transform: none; }
        }
        @media (max-width: 900px) {
            .partners-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .container {
                width: min(100% - 28px, 1120px);
            }

            .partners-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            main {
                padding-top: 38px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <a class="brand" href="index.html">
                <img src="/assets/images/Asset%202.svg" alt="GMNOA logo">
                <span>GMNOA</span>
            </a>
            <a class="back" href="index.html#partners">Back to partnerships</a>
        </div>
    </header>
    <main class="container">
        <section class="page-header">
            <div class="meta">Partnerships</div>
            <h1 id="partnersTitle">All partners</h1>
            <p class="intro">Our partners and collaborators support member welfare, professional development and maritime progress.</p>
        </section>
        <section class="partners-grid" id="partnersGrid" aria-labelledby="partnersTitle" aria-busy="true">
            <p class="partners-message" role="status">Loading partners...</p>
        </section>
    </main>
    <script type="module" src="/src/js/partners.js"></script>
    <script type="module" src="/src/js/no-download.js"></script>
</body>
</html>
